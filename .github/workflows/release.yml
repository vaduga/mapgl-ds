name: Release

on:
  push:
    tags: ['v*']

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - run: npm ci
      - run: npm run build:wasm
      - run: git diff --exit-code -- wasm-core/pkg/agent_core.js
      - run: npm run verify

  release:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        env:
          TAG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          PLUGIN_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src/plugin.json', 'utf8')).info.version")
          echo "package.json:   $PACKAGE_VERSION"
          echo "src/plugin.json: $PLUGIN_VERSION"
          echo "tag:            $TAG_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ] || [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch. Run 'npm run bump -- $TAG_VERSION' and commit before tagging."
            exit 1
          fi

      - name: Install dependencies and build plugin
        run: |
          npm ci
          npm run build

      - name: Sign plugin
        if: env.GRAFANA_ACCESS_POLICY_TOKEN != ''
        run: npm run sign

      - name: Package plugin
        id: package
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PLUGIN_ID=$(node -p "JSON.parse(require('fs').readFileSync('src/plugin.json', 'utf8')).id")
          ARCHIVE="${PLUGIN_ID}-${VERSION}.zip"
          (cd dist && zip -qr "../${ARCHIVE}" "${PLUGIN_ID}")
          sha1sum "${ARCHIVE}" | cut -f1 -d' ' > "${ARCHIVE}.sha1"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      # The Grafana build-plugin action invokes @latest internally and has no validator-version input.
      # Pin the upstream CLI binary and verify its published checksum instead.
      - name: Validate plugin archive with pinned Grafana validator
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VALIDATOR_VERSION: '0.49.7'
          VALIDATOR_SHA256: '4ef0618ac73db75db136ad558e9100fbfea5a591c3438fda4c1ef737c2174a06'
        run: |
          TARBALL="plugin-validator_${VALIDATOR_VERSION}_linux_amd64.tar.gz"
          RELEASE_URL="https://github.com/grafana/plugin-validator/releases/download/plugin-validator/v${VALIDATOR_VERSION}"
          curl --fail --silent --show-error --location "${RELEASE_URL}/${TARBALL}" --output "/tmp/${TARBALL}"
          echo "${VALIDATOR_SHA256}  /tmp/${TARBALL}" | sha256sum --check
          tar -xzf "/tmp/${TARBALL}" -C /tmp plugincheck2
          chmod +x /tmp/plugincheck2
          /tmp/plugincheck2 -sourceCodeUri "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}" "${ARCHIVE}"

      - name: Attest plugin archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha1
          body: |
            **This GitHub draft release has been built and attested for Grafana.**

            To submit this release to Grafana, review and publish this draft, then submit these assets through the Grafana plugin catalog:
            - Plugin ZIP: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.package.outputs.archive }}
            - SHA1: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.package.outputs.archive }}.sha1
