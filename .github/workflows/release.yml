name: Release

on:
  push:
    tags: ['v*']

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - run: npm ci
      - run: npm run build:wasm
      - run: git diff --exit-code -- wasm-core/pkg/agent_core.js
      - run: npm run verify

  release:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        env:
          TAG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          PLUGIN_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src/plugin.json', 'utf8')).info.version")
          echo "package.json:   $PACKAGE_VERSION"
          echo "src/plugin.json: $PLUGIN_VERSION"
          echo "tag:            $TAG_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ] || [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch. Run 'npm run bump -- $TAG_VERSION' and commit before tagging."
            exit 1
          fi

      # This pinned Grafana action signs, validates, packages, and attests the release archive.
      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.0
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          attestation: true
          node-version: '22'
