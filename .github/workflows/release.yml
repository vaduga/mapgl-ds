name: Release

on:
  push:
    tags: ['v*']

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run verify
      - run: npm run build:webpack

  release:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: npm run build

      - name: Verify version consistency
        env:
          TAG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          PLUGIN_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src/plugin.json', 'utf8')).info.version")
          echo "package.json:   $PACKAGE_VERSION"
          echo "src/plugin.json: $PLUGIN_VERSION"
          echo "tag:            $TAG_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ] || [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch. Run 'npm run bump -- $TAG_VERSION' and commit before tagging."
            exit 1
          fi

      - name: Sign plugin
        if: env.GRAFANA_ACCESS_POLICY_TOKEN != ''
        run: npm run sign

      - name: Package plugin
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: zip -qr "vaduga-mapgl-datasource-${VERSION}.zip" vaduga-mapgl-datasource

      - name: Validate plugin archive
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: npx --yes @grafana/plugin-validator@latest -sourceCodeUri file://. -jsonOutput "dist/vaduga-mapgl-datasource-${VERSION}.zip"

      - name: Generate checksum
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: sha256sum "vaduga-mapgl-datasource-${VERSION}.zip" > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vaduga-mapgl-datasource-${{ steps.version.outputs.VERSION }}.zip
            dist/checksums.txt
          generate_release_notes: true
