name: Release
on:
  push:
    tags: ['v*']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: cargo install wasm-pack
      - run: bun install
      - run: bun run build:wasm
      - run: bun run lint
      - run: bun run test

  release:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: bun install
      - run: bun run build

      - name: Verify version consistency
        run: |
          PKG_VER=$(bun -e "console.log(require('./package.json').version)")
          PLUGIN_VER=$(bun -e "console.log(require('./plugin.json').info.version)")
          TAG_VER="${{ steps.version.outputs.VERSION }}"
          echo "package.json: $PKG_VER"
          echo "plugin.json:  $PLUGIN_VER"
          echo "tag:          $TAG_VER"
          if [ "$PKG_VER" != "$TAG_VER" ] || [ "$PLUGIN_VER" != "$TAG_VER" ]; then
            echo "::error::Version mismatch! Run 'bun run bump $TAG_VER' and commit before tagging."
            exit 1
          fi

      - name: Sign plugin
        run: npx @grafana/sign-plugin@latest
        if: env.GRAFANA_ACCESS_POLICY_TOKEN != ''

      - name: Validate plugin
        run: npx @grafana/plugin-validator@latest -sourceCodeUri file://. dist/grafana-observability-agent-panel
        continue-on-error: true

      - name: Package plugin
        run: |
          cd dist
          tar czf grafana-observability-agent-panel-${{ steps.version.outputs.VERSION }}.tar.gz grafana-observability-agent-panel/
          sha256sum grafana-observability-agent-panel-${{ steps.version.outputs.VERSION }}.tar.gz > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/grafana-observability-agent-panel-${{ steps.version.outputs.VERSION }}.tar.gz
            dist/checksums.txt
          generate_release_notes: true
