name: vaduga-mapgl-ds

services:
  grafana:
    container_name: vaduga-mapgl-ds-grafana
    image: grafana/grafana:${GRAFANA_VERSION:-12.4.3-security-02}
    ports:
      - "3000:3000"
    environment:
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=vaduga-mapgl-datasource,vaduga-mapglpro-panel
      - GF_INSTALL_PLUGINS=vaduga-mapgl-panel
      - GF_PLUGINS_ENABLE_ALPHA=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_LOG_LEVEL=info
      - GF_PATHS_PLUGINS=/var/lib/grafana-plugins
    volumes:
      - ./docker_data/grafana_plugins:/var/lib/grafana-plugins
      - ./dist/vaduga-mapgl-datasource:/var/lib/grafana-plugins/vaduga-mapgl-datasource:ro
#      - ./dist_pro:/var/lib/grafana-plugins/vaduga-mapglpro-panel:ro
      - ./provisioning:/etc/grafana/provisioning
      - ./docker_data/grafana_data:/var/lib/grafana
    networks:
      - vaduga-mapgl-ds-net
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      tempo:
        condition: service_healthy

  otel-mock:
    container_name: vaduga-mapgl-ds-otel-mock
    build:
      context: .
      dockerfile: otel-mock/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # Generate enough traces for a reviewer to see a populated dashboard quickly.
      OTEL_MOCK_TICK_MS: "5000"
      RUST_LOG: info
    networks:
      - vaduga-mapgl-ds-net
    deploy:
      resources:
        limits:
          memory: 128m
    depends_on:
      tempo:
        condition: service_healthy

  tempo:
    container_name: vaduga-mapgl-ds-tempo
    image: grafana/tempo:2.6.1
    user: root
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ./provisioning/tempo/tempo.yml:/etc/tempo/tempo.yml
      - tempo-data:/var/lib/tempo
    networks:
      - vaduga-mapgl-ds-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://localhost:3200/api/search?limit=1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 756m
    command:
      - -config.file=/etc/tempo/tempo.yml

networks:
  vaduga-mapgl-ds-net:
    name: vaduga-mapgl-ds-net
    driver: bridge

volumes:
  tempo-data:
