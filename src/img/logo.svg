<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tree network node graph globe logo with alerting endpoint and database">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5F58A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFCDD2"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </radialGradient>
  </defs>

  <!-- Original logo content -->
  <g transform="scale(1.2) translate(-21.33 -21.33)">
    <circle cx="128" cy="128" r="96" fill="none" stroke="#4CAF50" stroke-width="6"/>

    <g stroke="#66BB6A" stroke-width="3" stroke-linecap="round">
      <line x1="128" y1="72" x2="96" y2="112"/>
      <line x1="128" y1="72" x2="160" y2="112"/>
      <line x1="96" y1="112" x2="72" y2="160"/>
      <line x1="96" y1="112" x2="112" y2="160"/>
      <line x1="160" y1="112" x2="144" y2="160"/>
      <line x1="160" y1="112" x2="184" y2="160"/>
    </g>

    <g>
      <circle cx="128" cy="72" r="10" fill="#9FE870"/>
      <circle cx="96" cy="112" r="8" fill="#9FE870"/>
      <circle cx="160" cy="112" r="8" fill="#9FE870"/>
      <circle cx="72" cy="160" r="6" fill="#9FE870"/>
      <circle cx="112" cy="160" r="6" fill="#9FE870"/>
      <circle cx="144" cy="160" r="6" fill="#9FE870"/>
      <circle cx="184" cy="160" r="6" fill="#E53935">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="184" cy="160" r="10" fill="url(#alertGlow)" opacity="0.6">
        <animate attributeName="r" values="8;14;8" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle cx="128" cy="72" r="16" fill="url(#coreGlow)" opacity="0.35"/>

    <!-- Small database icon, 10% larger than the prior treatment -->
    <!-- 24.2 x 27.5 user units, centered at x=128 -->
    <g fill="none" stroke="#66BB6A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- top ellipse -->
      <ellipse cx="128" cy="188.5" rx="12.1" ry="4.2"/>
      <!-- side walls -->
      <path d="M115.9 188.5 V207.6 M140.1 188.5 V207.6"/>
      <!-- tier separators -->
      <path d="M115.9 195.0 C115.9 197.4 121.3 199.2 128 199.2 C134.7 199.2 140.1 197.4 140.1 195.0"/>
      <path d="M115.9 201.3 C115.9 203.7 121.3 205.5 128 205.5 C134.7 205.5 140.1 203.7 140.1 201.3"/>
      <!-- bottom curve -->
      <path d="M115.9 207.6 C115.9 210.0 121.3 211.8 128 211.8 C134.7 211.8 140.1 210.0 140.1 207.6"/>
    </g>
  </g>
</svg>
