server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

ingester:
  max_block_duration: 2m
  max_block_bytes: 2097152

compactor:
  compaction:
    # Keep enough history for the provisioned six-hour development dashboard.
    block_retention: 24h
    # Must exceed the blocklist polling staleness window (2 * 1m).
    compacted_block_retention: 15m

storage:
  trace:
    backend: local
    wal:
      path: /var/lib/tempo/wal
    local:
      path: /var/lib/tempo/blocks
    blocklist_poll: 1m
    pool:
      max_workers: 2
      queue_depth: 64

overrides:
  defaults:
    global:
      max_bytes_per_trace: 500000
